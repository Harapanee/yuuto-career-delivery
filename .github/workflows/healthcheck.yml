name: 疎通確認

# publish.py は予定時刻の±90分の外だと一度もAPIを叩かないまま緑になる。
# それを成功の証拠にしないため、読み取りのみで実際にAPIを叩くジョブを分けてある。
# 毎日回してトークンの残日数も監視する。
on:
  schedule:
    - cron: '0 0 * * *'       # 09:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: APIに疎通できるか確認する(読み取りのみ)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python publish/healthcheck.py
