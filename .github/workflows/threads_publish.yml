name: Threads公開

# public リポジトリのため pull_request トリガーは付けない(secrets 保護)。
on:
  # schedule は使わない。GitHub の cron は最大5時間遅れ、threads_publish.py の窓
  # (予定 -35分〜+180分)を外して「スキップ」のまま success になる。
  # 2026-09-22 に 12:30 枠を実際に落とした。以降の本番起動は Mac の launchd
  # (com.harapon.yuuto-threads-{am,noon,pm} → ~/ops/run_yuuto_threads.sh)。
  # ここに残す workflow_dispatch は、Mac が落ちていたときの取りこぼし用。
  workflow_dispatch:
    inputs:
      key:
        description: '取りこぼしを手動で公開するときだけ指定(例 T001_20261001_0700)。空なら時刻で選ぶ'
        required: false
        default: ''

concurrency:
  group: threads-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Threads に公開する
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          PUBLISH_KEY: ${{ inputs.key }}
        run: python publish/threads_publish.py
      - name: threads_state.json を保存する
        if: always()
        run: |
          if [[ -n "$(git status --porcelain threads_state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add threads_state.json
            git commit -m "chore(threads): 投稿結果を記録"
            git push
          fi
